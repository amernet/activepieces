name: Build Salesbay image

# Builds the fork's Activepieces image (community edition + Salesbay
# customizations: salesbay piece, portal embed mode) and pushes it to GHCR.
# The ai-saas prod compose stack pulls ghcr.io/amernet/activepieces:salesbay.

on:
  push:
    branches: [feat/salesbay-piece]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The salesbay piece is installed into the running instance as a tarball
      # (DB archive), not baked into the image — and as an extra workspace
      # member it breaks `bun install --frozen-lockfile` because bun.lock was
      # generated before the piece existed. Drop it from the build context.
      - name: Exclude salesbay piece from workspace
        run: rm -rf packages/pieces/community/salesbay

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/amernet/activepieces:salesbay
            ghcr.io/amernet/activepieces:salesbay-${{ github.sha }}
